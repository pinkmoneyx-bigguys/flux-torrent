; aqtinstall settings for Flux: download.qt.io is unreachable from some regions,
; so official Qt mirrors are used both for archives and for checksums.
[aqt]
concurrency: 4
baseurl: https://mirrors.dotsrc.org/qtproject

[requests]
connection_timeout: 10
response_timeout: 60
max_retries_on_connection_error: 5
retry_backoff: 1.0
max_retries_on_checksum_error: 3
max_retries_to_retrieve_hash: 5
; mirrors carry <archive>.sha1 next to every archive, but not the .sha256 files
hash_algorithm: sha1

[mirrors]
trusted_mirrors:
    https://mirrors.dotsrc.org/qtproject
blacklist:
    https://download.qt.io
    http://download.qt.io
fallbacks:
    https://mirrors.ocf.berkeley.edu/qt
    https://mirrors.tuna.tsinghua.edu.cn/qt
