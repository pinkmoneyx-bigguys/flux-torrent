name: Feature request
description: An idea that would make Flux better.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Ideas are welcome! Please check the [existing requests](https://github.com/pinkmoneyx-bigguys/flux-torrent/issues?q=is%3Aissue+label%3Aenhancement) first — a 👍 on one of them counts too.
        You can write in English or Russian.

  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: The situation and what gets in the way today.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: How could Flux help?
      description: How you picture it. Sketches or screenshots of other apps are welcome.
