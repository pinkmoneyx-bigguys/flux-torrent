name: Bug report
description: Something in Flux does not work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this! A few details make a bug much quicker to fix.
        Before you start, please check that it still happens in the [latest release](https://github.com/pinkmoneyx-bigguys/flux-torrent/releases/latest) and that it is not [reported already](https://github.com/pinkmoneyx-bigguys/flux-torrent/issues?q=is%3Aissue).
        You can write in English or Russian.

  - type: input
    id: version
    attributes:
      label: Flux version
      description: Settings → About Flux shows it.
      placeholder: "0.1.0"
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How is Flux installed?
      options:
        - With the installer (Flux-…-setup.exe)
        - Portable (Flux-…-portable-win64.zip)
        - Built from source
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 24H2"
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what Flux did instead. Screenshots help a lot.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Click …
        3. See …

  - type: textarea
    id: log
    attributes:
      label: Log
      description: |
        If it is about torrents or the network, the log helps: `%LOCALAPPDATA%\Flux\logs\qbittorrent.log` (or the `profile` folder of a portable Flux).
      render: text
